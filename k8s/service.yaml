apiVersion: v1
kind: Service
metadata:
  name: tts-frontend-service
spec:
  type: NodePort
  selector:
    app: tts-frontend # This MUST match the label in your Deployment
  ports:
    - protocol: TCP
      port: 80         # The port the service listens on inside the cluster
      targetPort: 80   # The port your container is listening on
      nodePort: 30080  # The port you will use in your browser (30000-32767)